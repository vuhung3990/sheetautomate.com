    <!-- Theme initialisation (follows system preference unless overridden in localStorage) -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var stored = localStorage.getItem('sheetautomate_theme');
        var colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.classList.add(stored);
          document.documentElement.classList.remove(stored === 'dark' ? 'light' : 'dark');
          if (colorSchemeMeta) colorSchemeMeta.content = stored;
        } else {
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', prefersDark);
          document.documentElement.classList.toggle('light', !prefersDark);
          if (colorSchemeMeta) colorSchemeMeta.content = 'light dark';
        }
      } catch (e) {}
    </script>

cond, our CI pipeline checks every line for dangerous patterns and enforces minimum Google permissions (least-privilege OAuth scopes) plus duplicate-run protection (LockService). Third, release bundles are scanned across 60+ security engines on VirusTotal with 0 detections."}},{"@type":"Question","name":"Does any spreadsheet or customer data leave my Google Workspace?","acceptedAnswer":{"@type":"Answer","text":"Never. SheetAutomate does not run any backend server or database. All scripts execute privately inside Google Apps Script under your own Google Account, moving data directly between your Google Sheets, Docs, Drive, and Gmail."}},{"@type":"Question","name":"Why does Google show \"Google hasn’t verified this app\" the first time I run a script?","acceptedAnswer":{"@type":"Answer","text":"That screen is completely normal when you paste your own Apps Script into a Google Sheet. Google shows it for any personal script that has not been submitted to the public Google Workspace Marketplace. You are only authorizing yourself to run your own copy inside your Google Drive — SheetAutomate never sees your data or credentials. Simply click Advanced → Go to [project name] (unsafe) once to continue, and you can inspect, delete the script, or revoke access anytime in your Google Account permissions."}},{"@type":"Question","name":"Are there any limits on how many documents or emails I can automate?","acceptedAnswer":{"@type":"Answer","text":"SheetAutomate imposes zero artificial caps. You are only governed by Google Workspace’s standard daily Apps Script quotas (such as 1,500 document creations/day and 6-minute batch execution windows)."}},{"@type":"Question","name":"Can I customize or use SheetAutomate for commercial client projects?","acceptedAnswer":{"@type":"Answer","text":"Yes! Under the permissive MIT License, you can freely modify the Code.gs scripts, swap Google Doc templates, add custom webhooks in Script Properties, and deploy them for internal teams or commercial c
